[project]
name = "knowledge-tree-agent-tooling"
version = "0.0.0"
description = "Repository validation tooling for Knowledge Tree Agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema[format]>=4.25,<5",
  "pypdf>=6.10,<7",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6.0,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "packages/contracts-py/src", "packages/domain/src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "node_modules", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["scripts"]
