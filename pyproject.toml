[project]
name = "knowledge-tree-agent-tooling"
version = "0.0.0"
description = "Repository validation tooling for Knowledge Tree Agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141.1",
  "jsonschema[format]>=4.25,<5",
  "mcp<2",
  "pypdf>=6.10,<7",
  "python-multipart>=0.0.32",
  "pywebview>=5,<7",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
  "httpx2>=2.10.0",
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6.0,<7",
]
build = [
  "pillow>=10,<12",
  "pyinstaller>=6,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "packages/contracts-py/src", "packages/domain/src", "packages/infrastructure/src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "node_modules", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"packages/contracts-py/src/knowledge_tree_contracts/_generated_*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["scripts"]
mypy_path = ["packages/contracts-py/src", "packages/domain/src", "packages/infrastructure/src"]

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true
